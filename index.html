<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMIP6 伺服器資料庫總覽</title>
<style>
  :root{
    --bg:#f3f8f4; --panel:#ffffff; --ink:#203025; --sub:#5e6f64;
    --line:#dfeae2; --accent:#2f8f5b; --accent-soft:#dcf0e2;
    --chip:#e8f4eb; --chip-ink:#245c3c; --mono:#3f5c4d;
    --shadow: 0 1px 2px rgba(21,74,45,0.05), 0 4px 14px rgba(21,74,45,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
  }
  header{ padding: 24px 24px 18px; max-width:1180px; margin:0 auto; }
  .brand-bar{ display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .brand-left{ display:flex; align-items:center; gap:16px; min-width:0; }
  .brand-text h1{ font-size:1.55rem; margin:0 0 6px; font-weight:700; letter-spacing:.2px;}
  .brand-text p{ margin:0; color:var(--sub); font-size:.95rem; }
  .brand-logo{ display:block; object-fit:contain; }
  .brand-logo.ac3{ height:56px; width:56px; border-radius:10px; flex-shrink:0; }
  .brand-right{ display:flex; align-items:center; gap:18px; flex-shrink:0; }
  .brand-logo.cmip{ height:42px; }
  .brand-logo.wcrp{ height:42px; }
  @media (max-width:620px){ .brand-right{ order:3; width:100%; justify-content:flex-start; margin-top:6px; } }

  .tabs{ display:flex; gap:8px; max-width:1180px; margin: 8px auto 0; padding: 0 24px; }
  .tab-btn{
    border:1px solid var(--line); background:var(--panel); color:var(--sub);
    padding:9px 16px; border-radius:10px 10px 0 0; font-size:.92rem; cursor:pointer;
    font-weight:600; border-bottom:none; transform:translateY(1px);
  }
  .tab-btn.active{ color:var(--accent); background:var(--panel); border-color:var(--line);
    box-shadow: 0 -2px 0 var(--accent) inset; }
  main{ max-width:1180px; margin:0 auto 60px; padding: 0 24px; }
  .card-frame{
    background:var(--panel); border:1px solid var(--line); border-radius:0 12px 12px 12px;
    box-shadow:var(--shadow); min-height:560px; overflow:hidden;
  }
  .view{ display:none; }
  .view.active{ display:flex; }

  /* ---- model view ---- */
  .model-list{
    width: 320px; flex-shrink:0; border-right:1px solid var(--line); background:#f2f8f3;
    display:flex; flex-direction:column;
  }
  .search-box{ padding:14px; border-bottom:1px solid var(--line); }
  .search-box input{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:.88rem;
    outline:none; background:var(--panel);
  }
  .search-box input:focus{ border-color:var(--accent); }
  .model-scroll{ overflow:auto; flex:1; padding:8px; }
  .model-item{
    padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:2px;
  }
  .model-item:hover{ background:var(--chip); }
  .model-item.active{ background:var(--accent-soft); }
  .model-item .mname{ font-weight:700; font-size:.88rem; color:var(--ink); }
  .model-item.active .mname{ color:var(--accent); }
  .model-item .mmeta{ font-size:.72rem; color:var(--sub); margin-top:1px; }

  .model-detail{ flex:1; padding: 20px 26px; overflow:auto; }
  .model-detail h2{ margin:0 0 4px; font-size:1.3rem; }
  .model-detail .mstat{ color:var(--sub); font-size:.85rem; margin-bottom:14px; }

  .exp-block{ border-top:1px dashed var(--line); padding-top:14px; margin-top:16px; }
  .exp-title{
    font-size:.95rem; font-weight:700; margin-bottom:8px; cursor:pointer;
    display:flex; align-items:center; gap:8px; user-select:none;
  }
  .exp-title .count{ font-weight:500; color:var(--sub); font-size:.78rem; }
  .exp-title .arrow{ transition:.15s; color:var(--accent); font-size:.72rem; }
  .exp-title.collapsed .arrow{ transform:rotate(-90deg); }
  .exp-body{ }
  .exp-title.collapsed + .exp-body{ display:none; }

  .table-group{ margin: 8px 0 4px 6px; }
  .table-label{
    font-size:.74rem; font-weight:700; color:var(--chip-ink); background:var(--chip);
    display:inline-block; padding:2px 8px; border-radius:6px; margin-bottom:6px;
  }
  .var-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:8px; margin-bottom:6px; }
  .var-card{ border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fafdfb; }
  .var-card .vname{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:700; font-size:.82rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .var-card .vlong{ font-size:.8rem; color:var(--ink); font-weight:600; margin:3px 0 1px; }
  .var-card .vmeta{ font-size:.72rem; color:var(--sub); margin-bottom:5px; }
  .unit-badge{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight:600;
    font-size:.68rem; color:#245c3c; background:#dcf0e2; border-radius:5px; padding:1px 6px;
  }
  .file-toggle{
    font-size:.72rem; color:var(--accent); cursor:pointer; font-weight:600; margin-top:2px; display:inline-block;
  }
  .file-list{ margin-top:6px; display:none; }
  .file-list.open{ display:block; }
  .file-row{ margin: 3px 0; }
  .vtime{
    display:inline-block; font-size:.72rem; color:var(--mono); background:#e8f4eb;
    padding:2px 7px; border-radius:6px; margin:1px 3px 1px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .vpath{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.68rem; color:var(--mono); background:#f2f8f3; border:1px solid var(--line);
    border-radius:5px; padding:4px 7px; margin-top:2px; word-break:break-all; line-height:1.4;
  }

  /* ---- variable view ---- */
  .var-list-pane{
    width: 320px; flex-shrink:0; border-right:1px solid var(--line); background:#f2f8f3;
    display:flex; flex-direction:column;
  }
  .var-list-item{
    padding:9px 12px; border-radius:8px; cursor:pointer; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:.83rem; display:flex; justify-content:space-between; gap:8px; align-items:baseline;
  }
  .var-list-item:hover{ background:var(--chip); }
  .var-list-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .var-list-item .vd{ font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; font-size:.72rem; color:var(--sub); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .var-detail{ flex:1; padding:22px 26px; overflow:auto; }
  .var-detail h2{ margin:0 0 2px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:1.3rem; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .var-detail .vlong-full{ color:var(--ink); font-size:1rem; font-weight:600; margin:2px 0 12px; }

  .model-hit{
    border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px; background:#fafdfb;
  }
  .model-hit .mh-top{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .model-hit .mh-name{ font-weight:700; font-size:.92rem; }
  .model-hit .mh-count{ font-size:.76rem; color:var(--sub); }
  .exp-chip{ display:inline-block; background:var(--chip); color:var(--chip-ink); font-size:.72rem; padding:3px 8px; border-radius:6px; margin:6px 4px 0 0; font-weight:600; cursor:pointer; }
  .exp-chip.active{ background:var(--accent); color:#fff; }
  .mh-files{ margin-top:8px; display:none; }
  .mh-files.open{ display:block; }

  .loading{ color:var(--sub); font-size:.85rem; padding: 20px 0; }
  .empty-hint{ padding:60px 20px; text-align:center; color:var(--sub); font-size:.9rem; }

  .footnote{ max-width:1180px; margin: 18px auto 0; padding:0 24px; color:var(--sub); font-size:.78rem; }

  @media (max-width: 760px){
    .view.active{ flex-direction:column; }
    .model-list, .var-list-pane{ width:100%; border-right:none; border-bottom:1px solid var(--line); max-height:220px; }
  }
</style>
</head>

      </div>
      <div class="model-detail" id="modelDetail"><div class="empty-hint">← 請選擇左側的模式</div></div>
    </div>
    <div id="view-var" class="view">
      <div class="var-list-pane">
        <div class="search-box"><input type="text" id="varSearch" placeholder="搜尋變數名稱 / 說明…"></div>
        <div class="var-scroll" id="varListScroll" style="overflow:auto; flex:1; padding:8px;"><div class="loading">載入變數索引中…</div></div>
      </div>

<script>
const DATA_DIR = './data';
let MODELS_SUMMARY = null;     // from models.json
let VAR_INDEX = null;          // from variables_index.json
const modelCache = {};         // model name -> loaded model_<x>.json content

async function loadJSON(path){
  const res = await fetch(path);
  if(!res.ok) throw new Error('fetch failed: '+path);
  return res.json();
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.tab).classList.add('active');
  });
});

/* ---------------- Model view ---------------- */
const modelScroll = document.getElementById('modelScroll');
const modelDetail = document.getElementById('modelDetail');
const modelSearch = document.getElementById('modelSearch');

function renderModelList(filter){
  const f = (filter||'').trim().toLowerCase();
  modelScroll.innerHTML = '';
  MODELS_SUMMARY.models.forEach(m=>{
    if(f && !m.model.toLowerCase().includes(f)) return;
    const div = document.createElement('div');
    div.className = 'model-item';
    div.dataset.model = m.model;
    div.innerHTML = `<div class="mname">${m.model}</div>
      <div class="mmeta">${m.n_experiments} 實驗・${m.n_variables} 變數・${m.n_files.toLocaleString()} 檔案</div>`;
    div.addEventListener('click', ()=> selectModel(m));
    modelScroll.appendChild(div);
  });
}

async function selectModel(m){
  document.querySelectorAll('.model-item').forEach(e=>e.classList.toggle('active', e.dataset.model===m.model));
  modelDetail.innerHTML = `<div class="loading">載入 ${m.model}（${m.n_files.toLocaleString()} 個檔案）中…</div>`;
  let data = modelCache[m.model];
  if(!data){
    try{
      data = await loadJSON(`${DATA_DIR}/${m.file}`);
      modelCache[m.model] = data;
    }catch(e){
      modelDetail.innerHTML = `<div class="empty-hint">載入失敗：${e.message}</div>`;
      return;
    }
  }
  renderModelDetail(m, data);
}

function renderVarGrid(vars, idPrefix){
  const varNames = Object.keys(vars).sort();
  const byTable = {};
  varNames.forEach(v=>{
    const t = vars[v].table || '?';
    (byTable[t] = byTable[t] || []).push(v);
  });
  const tableNames = Object.keys(byTable).sort();
  let html = '';
  tableNames.forEach(t=>{
    html += `<div class="table-group"><span class="table-label">${t}</span><div class="var-grid">`;
    byTable[t].forEach(v=>{
      const info = vars[v];
      const unitBadge = info.units ? `<span class="unit-badge">${info.units}</span>` : '';
      const uid = `f_${idPrefix}_${t}_${v}`.replace(/[^A-Za-z0-9_]/g,'_');
      let rows = '';
      info.files.forEach(f=>{
        const tm = f.time || '固定場・無時間軸';
        rows += `<div class="file-row"><span class="vtime">${tm}</span><span style="font-size:.72rem;color:var(--sub);">${f.member}</span><div class="vpath">${f.path}</div></div>`;
      });
      html += `<div class="var-card">
        <div class="vname">${v} ${unitBadge}</div>
        <div class="vlong">${info.long_name || ''}</div>
        <div class="vmeta">${info.files.length} 個檔案・${info.realm}</div>
        <span class="file-toggle" data-target="${uid}">顯示檔案清單 ▾</span>
        <div class="file-list" id="${uid}">${rows}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

function countVars(expNode){
  const s = new Set(Object.keys(expNode.direct||{}));
  Object.values(expNode.sub||{}).forEach(vars=> Object.keys(vars).forEach(v=>s.add(v)));
  return s.size;
}

function renderModelDetail(m, data){
  let html = `<h2>${m.model}</h2>
    <div class="mstat">${m.n_experiments} 個實驗・${m.n_variables} 個變數・共 ${m.n_files.toLocaleString()} 個檔案</div>`;

  const expNames = Object.keys(data.experiments).sort();
  expNames.forEach(exp=>{
    const expNode = data.experiments[exp];
    const nVars = countVars(expNode);
    const subNames = Object.keys(expNode.sub||{}).sort();

    html += `<div class="exp-block">
      <div class="exp-title collapsed" data-exp="${exp}">
        <span class="arrow">▾</span> ${exp}
        <span class="count">（${nVars} 個變數${subNames.length ? '・' + subNames.length + ' 個起始日期/子實驗' : ''}）</span>
      </div>
      <div class="exp-body">`;

    if(expNode.direct && Object.keys(expNode.direct).length){
      html += renderVarGrid(expNode.direct, exp);
    }

    if(subNames.length){
      subNames.forEach(subexp=>{
        const subVars = expNode.sub[subexp];
        const subId = `sub_${exp}_${subexp}`.replace(/[^A-Za-z0-9_]/g,'_');
        html += `<div class="table-group">
          <div class="exp-title collapsed" data-subexp="${subId}" style="font-size:.85rem;">
            <span class="arrow">▾</span> ${subexp}
            <span class="count">（${Object.keys(subVars).length} 個變數）</span>
          </div>
          <div class="exp-body">${renderVarGrid(subVars, subId)}</div>
        </div>`;
      });
    }

    html += `</div></div>`;
  });

  modelDetail.innerHTML = html;
  modelDetail.scrollTop = 0;

  modelDetail.querySelectorAll('.exp-title').forEach(et=>{
    et.addEventListener('click', ()=> et.classList.toggle('collapsed'));
  });
  modelDetail.querySelectorAll('.file-toggle').forEach(ft=>{
    ft.addEventListener('click', ()=>{
      const target = document.getElementById(ft.dataset.target);
      const open = target.classList.toggle('open');
      ft.textContent = open ? '隱藏檔案清單 ▴' : '顯示檔案清單 ▾';
    });
  });
}

modelSearch.addEventListener('input', e=> renderModelList(e.target.value));

/* ---------------- Variable view ---------------- */
const varListScroll = document.getElementById('varListScroll');
const varDetail = document.getElementById('varDetail');
const varSearch = document.getElementById('varSearch');
let allVarNames = [];

function renderVarList(filter){
  const f = (filter||'').trim().toLowerCase();
  varListScroll.innerHTML = '';
  allVarNames.forEach(v=>{
    const meta = VAR_INDEX[v];
    const searchable = `${v} ${meta.long_name||''}`.toLowerCase();
    if(f && !searchable.includes(f)) return;
    const item = document.createElement('div');
    item.className = 'var-list-item';
    item.dataset.var = v;
    item.innerHTML = `<span>${v}</span><span class="vd">${meta.long_name || ''}</span>`;
    item.addEventListener('click', ()=> selectVar(v));
    varListScroll.appendChild(item);
  });
}

function selectVar(varName){
  document.querySelectorAll('.var-list-item').forEach(e=>e.classList.toggle('active', e.dataset.var===varName));
  const meta = VAR_INDEX[varName];
  const unitBadge = meta.units ? `<span class="unit-badge">${meta.units}</span>` : '';
  const modelNames = Object.keys(meta.models).sort();
  let html = `<h2>${varName} ${unitBadge}</h2>
    <div class="vlong-full">${meta.long_name || ''}</div>
    <div style="color:var(--sub); font-size:.85rem; margin-bottom:16px;">出現於 ${modelNames.length} 個模式</div>`;

  modelNames.forEach(model=>{
    const exps = meta.models[model];
    const mid = `mh_${model}`.replace(/[^A-Za-z0-9_]/g,'_');
    html += `<div class="model-hit">
      <div class="mh-top" data-model="${model}" data-var="${varName}" data-target="${mid}">
        <span class="mh-name">${model}</span>
        <span class="mh-count">${exps.length} 個實驗 ▾</span>
      </div>
      <div>${exps.map(e=>`<span class="exp-chip" data-model="${model}" data-exp="${e}" data-var="${varName}">${e}</span>`).join('')}</div>
      <div class="mh-files" id="${mid}"></div>
    </div>`;
  });

  varDetail.innerHTML = html;
  varDetail.scrollTop = 0;

  varDetail.querySelectorAll('.exp-chip').forEach(chip=>{
    chip.addEventListener('click', async ()=>{
      const { model, exp, var: v } = chip.dataset;
      const mid = `mh_${model}`.replace(/[^A-Za-z0-9_]/g,'_');
      const box = document.getElementById(mid);
      box.classList.add('open');
      box.innerHTML = `<div class="loading">載入 ${model} 中…</div>`;
      varDetail.querySelectorAll('.exp-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      try{
        let data = modelCache[model];
        if(!data){
          const m = MODELS_SUMMARY.models.find(mm=>mm.model===model);
          data = await loadJSON(`${DATA_DIR}/${m.file}`);
          modelCache[model] = data;
        }
        const expNode = data.experiments[exp];
        let info = expNode.direct ? expNode.direct[v] : undefined;
        let subLabel = '';
        if(!info && expNode.sub){
          // variable lives inside one or more sub-experiments (e.g. dcppA-hindcast start dates)
          const subNames = Object.keys(expNode.sub).filter(s=> expNode.sub[s][v]).sort();
          if(subNames.length){
            const combinedFiles = [];
            let table = '', units = '', realm = '', long_name = '';
            subNames.forEach(s=>{
              const vn = expNode.sub[s][v];
              table = vn.table; units = vn.units; realm = vn.realm; long_name = vn.long_name;
              vn.files.forEach(f=> combinedFiles.push({...f, subexp: s}));
            });
            info = { table, units, realm, long_name, files: combinedFiles };
            subLabel = `<span style="font-size:.76rem;color:var(--sub);">（合併 ${subNames.length} 個起始日期/子實驗：${subNames[0]}…${subNames[subNames.length-1]}）</span>`;
          }
        }
        if(!info){ box.innerHTML = '<div class="loading">找不到資料</div>'; return; }
        const unitBadge = info.units ? `<span class="unit-badge">${info.units}</span>` : '';
        let rows = '';
        info.files.forEach(f=>{
          const tm = f.time || '固定場・無時間軸';
          const subTag = f.subexp ? `<span style="font-size:.72rem;color:var(--accent);">${f.subexp}</span> ` : '';
          rows += `<div class="file-row">${subTag}<span class="vtime">${tm}</span><span style="font-size:.72rem;color:var(--sub);">${f.member}</span><div class="vpath">${f.path}</div></div>`;
        });
        box.innerHTML = `<div style="margin:8px 0 4px;"><span class="table-label">${info.table}</span> ${unitBadge} <span style="font-size:.76rem;color:var(--sub);">${info.files.length} 個檔案</span> ${subLabel}</div>${rows}`;
      }catch(e){
        box.innerHTML = `<div class="loading">載入失敗：${e.message}</div>`;
      }
    });
  });
}

varSearch.addEventListener('input', e=> renderVarList(e.target.value));

/* ---------------- init ---------------- */
(async function init(){
  try{
    MODELS_SUMMARY = await loadJSON(`${DATA_DIR}/models.json`);
    renderModelList('');
    document.getElementById('headerSub').textContent =
      `共 ${MODELS_SUMMARY.models.length} 個模式・${MODELS_SUMMARY.n_parsed.toLocaleString()} 個檔案已建檔。點選左側模式瀏覽其實驗與變數，或切換到「依變數瀏覽」跨模式搜尋。`;
  }catch(e){
    modelScroll.innerHTML = `<div class="loading">模式清單載入失敗：${e.message}</div>`;
  }
  try{
    VAR_INDEX = await loadJSON(`${DATA_DIR}/variables_index.json`);
    allVarNames = Object.keys(VAR_INDEX).sort();
    renderVarList('');
  }catch(e){
    varListScroll.innerHTML = `<div class="loading">變數索引載入失敗：${e.message}</div>`;
  }
})();
</script>
